# Basic IP-based rate limiting
SecAction "id:910005, phase:1, log, pass, initcol:ip=%{REMOTE_ADDR}"

SecRule IP:REQS "@gt 100" \
    "id:910008, phase:1, deny, status:429, t:none, msg:'Rate limit exceeded', severity:2"

SecAction "id:910006, phase:1, pass, log, logdata:'Incrementing ip.reqs', setvar:ip.reqs=+1, expirevar:ip.reqs=60"
