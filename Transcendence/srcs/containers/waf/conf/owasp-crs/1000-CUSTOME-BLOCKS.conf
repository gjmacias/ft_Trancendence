
SecRule REQUEST_URI "@beginsWith /admin.php" \
    "id:100001,\
    phase:2,\
    t:none,\
    deny,\
    log,\
    msg:'Blocked attempt to access /admin.php',\
    severity:CRITICAL,\
    tag:'application-specific',\
    status:403"

SecRule QUERY_STRING "@rx exec[=%20-9A-Za-z]*" \
    "id:100002,\
    phase:2,\
    t:none,\
    deny,\
    log,\
    msg:'Blocked attempt to access with exec',\
    severity:CRITICAL,\
    tag:'application-specific',\
    status:403"

SecRule QUERY_STRING "@rx (?i)cmd[\x20-\x7E]*" \
    "id:100003,\
    phase:2,\
    t:none,\
    deny,\
    log,\
    msg:'Blocked attempt to access with cmd',\
    severity:CRITICAL,\
    tag:'application-specific',\
    status:403"
