load_module /etc/nginx/modules/ngx_http_modsecurity_module.so;

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" ' \
					'$status $body_bytes_sent "$http_referer" ' \
					'"$http_user_agent" "$http_x_forwarded_for"';

	access_log  /var/log/nginx/access.log  main;

	sendfile        on;
	keepalive_timeout  65;

	# Servidor principal para la aplicación (puerto 443)
	server {
		listen       443 ssl;
		server_name  localhost transcendence;

		ssl_certificate		/etc/nginx/tls/nginx.crt;
		ssl_certificate_key	/etc/nginx/tls/nginx.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

		# Grafana (HTTPS configurado) - ANTES del location genérico
		location /grafana/ {
			proxy_pass https://grafana:3001/grafana/;
			
			# Configuración SSL para backend HTTPS
			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
			proxy_ssl_verify_depth 2;
			proxy_ssl_server_name on;
			
			# WebSocket support
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Prefix /grafana;
			
			# Timeouts para WebSocket
			proxy_read_timeout 86400;
			proxy_send_timeout 86400;
		}

		# Prometheus (HTTPS configurado) - ANTES del location genérico
		location /prometheus/ {
			proxy_pass https://prometheus:9090/;
			
			# Configuración SSL para backend HTTPS
			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
			proxy_ssl_verify_depth 2;
			proxy_ssl_server_name on;
			
			# Headers necesarios para Prometheus detrás de proxy
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# # Kibana (HTTP configurado) - ANTES del location genérico
		# location /kibana/ {
		# 	proxy_pass http://kibana:5601/kibana/;
			
		# 	# Headers estándar para HTTP
		# 	proxy_set_header Host $host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# 	proxy_set_header X-Forwarded-Prefix /kibana;
		# }
		
		# Aplicación principal
		location / {
			modsecurity on;
			modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

			proxy_pass https://frontend:5173;
			
			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
			proxy_ssl_verify_depth 2;

			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
    		proxy_set_header Connection "upgrade";
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /backend/ {
			proxy_pass https://backend:4000;

			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
			proxy_ssl_verify_depth 2;
			proxy_ssl_server_name on;

			proxy_set_header Host $host;
		}

		# location /chat/ {
		# 	proxy_pass https://chat:3000;

		# 	proxy_ssl_verify on;
		# 	proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
		# 	proxy_ssl_verify_depth 2;
		# 	proxy_ssl_server_name on;

		# 	proxy_set_header Host $host;
		# }

		location /game/ {
			proxy_pass https://game:10000;

			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
			proxy_set_header Host $host;

			proxy_ssl_verify on;
			proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
			proxy_ssl_verify_depth 2;
			proxy_ssl_server_name on;
		}

		 location /blockchain/ {
		 	proxy_pass https://blockchain:9650;

		 	#proxy_ssl_verify on;
		 	proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
		 	proxy_ssl_verify_depth 2;
		 	proxy_ssl_server_name on;
		 	proxy_set_header Host $host;
		 }
		
		error_page   500 502 503 504  /50x.html;
		location = /50x.html {
			root   /usr/share/nginx/html;
		}
	}

	server {
	    listen 8443 ssl;
	    server_name localhost transcendence;

	    ssl_certificate		/etc/nginx/tls/nginx.crt;
		ssl_certificate_key	/etc/nginx/tls/nginx.key;
		
		ssl_certificate     /etc/nginx/certs/waf.crt;
		ssl_certificate_key /etc/nginx/certs/waf.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

	    # Endpoint de métricas del backend (acceso restringido)
	    location /backend/metrics {
	        proxy_pass https://backend:4000;
	        proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
	        
	        # Configuración SSL
	        proxy_ssl_verify on;
	        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
	        proxy_ssl_verify_depth 2;
	        proxy_ssl_server_name on;
	        
	        # Bypass ModSecurity para métricas
	        modsecurity off;
	        
	        # Permitir solo desde Prometheus (red Docker)
	        allow 172.0.0.0/8;
	        deny all;
	    }
	}
}