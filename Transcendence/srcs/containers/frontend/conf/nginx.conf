worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen       5173 ssl;
        server_name  frontend;

        ssl_certificate /etc/nginx/certs/frontend.crt;
        ssl_certificate_key /etc/nginx/certs/frontend.key;

        ssl_client_certificate /etc/nginx/certs/ca.crt;

        ssl_protocols TLSv1.2 TLSv1.3;

        # testing certs ?

        # A parte de los certificados internos, hay que hacer también los de nginx?

        root /usr/share/nginx/html;
        index index.html;

        # Ruta principal
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache estático
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # Proxy API requests to the WAF (which then routes to the backend)
        # location /backend {
        #     proxy_pass https://waf:443/backend;  # Adjust hostname/port as needed
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # location /chat {
        #     proxy_pass https://waf:443/chat;  # Adjust hostname/port as needed
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
        # IDK!! No van las conexiones con el backend en producción

        # Evita que se muestren archivos ocultos (.env, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
